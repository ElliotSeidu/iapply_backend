name: Backend CI

on:
  push:
    branches:
      - main
      - release/prod-ready
  pull_request:

permissions:
  contents: read

jobs:
  test-and-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate ephemeral CI key
        run: |
          python -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"

      - name: Run Django system checks and migration check
        env:
          DEPLOYMENT_ENV: test
          DEBUG: "True"
          DB_ENGINE: sqlite3
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run unit test suite
        env:
          DEPLOYMENT_ENV: test
          DEBUG: "True"
          DB_ENGINE: sqlite3
        run: python manage.py test

      - name: Run production deployment check
        env:
          DEPLOYMENT_ENV: production
          DEBUG: "False"
          DB_ENGINE: postgres
          DB_SSLMODE: verify-full
          DB_NAME: iapply_ci
          DB_USER: iapply_ci
          DB_HOST: localhost
          REDIS_URL: rediss://localhost:6379/1
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://api.example.com
          ALLOWED_HOSTS: api.example.com
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: |
          export DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export EMAIL_HOST_USER="ci-user"
          export EMAIL_HOST_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python manage.py check --deploy --fail-level WARNING

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run pip-audit against requirements.txt
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --upgrade pip pip-audit
          /tmp/audit-venv/bin/pip-audit -r requirements.txt
